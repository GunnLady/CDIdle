name: CDIdle quality

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Resolve build identity
        shell: bash
        run: echo "VITE_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.1 --ignore-scripts
      - name: Verify npm
        run: test "$(npm --version)" = "12.0.1"
      - name: Install
        run: npm ci
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Start Supabase
        run: supabase start
      - name: Validate Workboard
        run: npm run board:validate
      - name: Secret audit
        run: npm run check:secrets
      - name: Log safety audit
        run: npm run check:logs
      - name: Migration safety audit
        run: npm run check:migrations
      - name: Determinism guard
        run: npm run check:determinism
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --run
      - name: Coverage report
        run: npm run test:coverage
      - name: Coverage thresholds
        run: npm run check:coverage
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: warn
      - name: Database tests
        run: npm run test:db
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Stop Supabase
        if: always()
        run: supabase stop
