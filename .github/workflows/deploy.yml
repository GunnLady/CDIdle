name: CDIdle backend deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "GitHub environment cible"
        required: true
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.1 --ignore-scripts
      - name: Verify npm
        run: test "$(npm --version)" = "12.0.1"
      - run: npm ci
      - run: npm run check
      - run: npm run check:migrations
      - name: Backup database before promotion
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase db dump --project-ref "$SUPABASE_PROJECT_REF" --file "$RUNNER_TEMP/cdidle-${{ inputs.environment }}-predeploy.sql"
      - uses: actions/upload-artifact@v7
        with:
          name: cdidle-${{ inputs.environment }}-predeploy-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/cdidle-${{ inputs.environment }}-predeploy.sql
          retention-days: 30
      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
      - name: Link Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Push additive migrations
        run: supabase db push
      - name: Deploy game-api
        run: supabase functions deploy game-api
      - name: Authenticated game-api smoke
        env:
          GAME_API_BASE_URL: ${{ secrets.GAME_API_BASE_URL }}
          GAME_API_TOKEN: ${{ secrets.GAME_API_TOKEN }}
        run: npm run smoke:game-api
