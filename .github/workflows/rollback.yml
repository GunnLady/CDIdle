name: CDIdle backend rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        type: choice
        options: [staging, production]
      git_ref:
        description: "Commit/tag artefact à redéployer"
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          package-manager-cache: false
      - name: Install pinned npm
        working-directory: ${{ runner.temp }}
        run: npm install --global npm@12.0.1 --ignore-scripts
      - name: Verify npm
        run: test "$(npm --version)" = "12.0.1"
      - run: npm ci
      - run: npm run check
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1
      - name: Link Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy previous game-api
        run: supabase functions deploy game-api
